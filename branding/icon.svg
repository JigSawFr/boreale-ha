<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PlayGuard for Home Assistant: PlayGuard's ring and play sign under a roof, lit as Aurore's aurora. -->
  <defs>
    <linearGradient id="i-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#16203A"/>
    </linearGradient>
    <linearGradient id="i-colour" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFCC"/>
      <stop offset="0.6" stop-color="#33BBFF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <radialGradient id="i-halo" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#33BBFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#33BBFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="i-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#i-night)"/>
  <rect width="256" height="256" rx="56" fill="url(#i-halo)"/>
  <circle cx="54" cy="58" r="1.8" fill="#E8EEF7"/><circle cx="206" cy="66" r="1.5" fill="#E8EEF7" opacity="0.8"/>
  <circle cx="190" cy="34" r="1.2" fill="#E8EEF7" opacity="0.6"/><circle cx="70" cy="30" r="1" fill="#E8EEF7" opacity="0.5"/>
  <path d="M44 120 L128 48 L212 120" fill="none" stroke="url(#i-colour)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#i-glow)" opacity="0.7"/>
  <path d="M44 120 L128 48 L212 120" fill="none" stroke="url(#i-colour)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="150" r="56" fill="none" stroke="#1F3355" stroke-width="13"/>
  <circle cx="128" cy="150" r="56" fill="none" stroke="url(#i-colour)" stroke-width="13" stroke-linecap="round" stroke-dasharray="264 352" transform="rotate(-90 128 150)" filter="url(#i-glow)" opacity="0.7"/>
  <circle cx="128" cy="150" r="56" fill="none" stroke="url(#i-colour)" stroke-width="13" stroke-linecap="round" stroke-dasharray="264 352" transform="rotate(-90 128 150)"/>
  <path d="M115 126 L156 150 L115 174 Z" fill="#E8EEF7" stroke="#E8EEF7" stroke-width="7" stroke-linejoin="round"/>
</svg>
