<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- The repository's social preview (1280x640), Aurore's sky; rendered to .github/readme/social-preview.png by
       scripts/render_branding.mjs, uploaded by hand in Settings › General. -->
  <defs>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="s-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFCC"/>
      <stop offset="0.55" stop-color="#33BBFF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <linearGradient id="s-colour" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFCC" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00FFCC"/>
      <stop offset="0.65" stop-color="#33BBFF"/>
      <stop offset="0.9" stop-color="#8A5CFF"/>
      <stop offset="1" stop-color="#8A5CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-rise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="s-rays" width="14" height="640" patternUnits="userSpaceOnUse">
      <rect width="14" height="640" fill="#fff" opacity="0.5"/>
      <rect x="3.5" width="6.3" height="640" fill="#fff"/>
    </pattern>
    <filter id="s-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4.2 2"/></filter>
    <filter id="s-line" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="s-rays-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <rect width="1280" height="640" fill="url(#s-rays)" filter="url(#s-soft)"/>
    </mask>
    <mask id="s-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <path d="M0 330 C 220 220, 440 360, 700 270 S 1100 180, 1280 230 L 1280 0 L 0 0 Z" fill="url(#s-rise)"/>
    </mask>
  </defs>
  <rect width="1280" height="640" fill="url(#s-sky)"/>
  <g opacity="0.55">
    <g mask="url(#s-fade)">
      <rect width="1280" height="640" fill="url(#s-colour)" mask="url(#s-rays-mask)"/>
    </g>
    <path d="M0 330 C 220 220, 440 360, 700 270 S 1100 180, 1280 230" fill="none" stroke="url(#s-colour)" stroke-width="10" filter="url(#s-line)"/>
    <path d="M0 330 C 220 220, 440 360, 700 270 S 1100 180, 1280 230" fill="none" stroke="url(#s-colour)" stroke-width="2.5" opacity="0.8"/>
  </g>
  <g fill="#E8EEF7">
    <circle cx="140" cy="60" r="1.6" opacity="0.7"/><circle cx="1130" cy="70" r="1.4" opacity="0.8"/>
    <circle cx="1200" cy="520" r="1.2" opacity="0.6"/><circle cx="90" cy="560" r="1.2" opacity="0.5"/>
    <circle cx="640" cy="40" r="1.3" opacity="0.6"/><circle cx="980" cy="600" r="1" opacity="0.5"/>
  </g>
  <image href="icon.svg" x="560" y="84" width="160" height="160"/>
  <text x="640" y="396" text-anchor="middle" font-family="Sora" font-weight="700" font-size="104" letter-spacing="-2.5" fill="#E8EEF7">Boréale</text>
  <text x="640" y="454" text-anchor="middle" font-family="Sora" font-size="34" fill="#33BBFF">for Home Assistant</text>
  <rect x="580" y="474" width="120" height="5" rx="2.5" fill="url(#s-word)"/>
  <text x="640" y="526" text-anchor="middle" font-family="Sora" font-size="28" fill="#A9B6CC">Your Switch homebrews, at home</text>
  <text x="640" y="574" text-anchor="middle" font-family="Sora" font-size="22" fill="#6F7E99">Play time · Limits · Extra time · Bedtime · Statistics · Local MQTT</text>
</svg>
