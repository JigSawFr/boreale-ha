[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Strict typing (the quality scale's platinum rule), against the Home
# Assistant release the tests install.
[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/playguard"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
