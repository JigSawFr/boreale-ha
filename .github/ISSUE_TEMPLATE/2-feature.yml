name: Feature request
description: Something the integration could do for a console that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The situation and what you are trying to achieve, rather than a solution.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: With the console's own Home Assistant device, an automation, PlayGuard on the console, or not at all.

  - type: textarea
    id: idea
    attributes:
      label: How the integration could do it
      description: Optional. Which entity, action or option. Something the console does not publish or take yet needs PlayGuard to change first.
