name: release-please

# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date (CHANGELOG.md, the version in manifest.json) from the
# conventional commits. Merging that PR creates the vX.Y.Z tag and the GitHub
# release; the job below then attaches playguard.zip, what HACS installs
# (hacs.json's zip_release), its SHA256SUMS.txt and their provenance.
#
# Each update of the release PR is also published as a pre-release of the
# next version, vX.Y.Z-dev.N (scripts/prerelease.py): HACS offers it to
# whoever turns the repository's Pre-release switch on. The 5 newest of a
# version are kept, and all of them go once vX.Y.Z is released.
on:
  push:
    branches: [ main ]
  # Re-run by hand, e.g. after a failed asset upload.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A token of the "PlayGuard Release" GitHub App when the repository has it
      # (variable RELEASE_APP_CLIENT_ID, secret RELEASE_APP_PRIVATE_KEY), as
      # PlayGuard: its pushes to the release PR trigger the other workflows, so
      # the checks report on it, and a tag ruleset can let it through. Without
      # it, GITHUB_TOKEN: releases still work, the release PR just gets no CI.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_APP_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write        # upload to the release
      id-token: write        # sign the attestation
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The tag's commit gives the zip's dates: the same tag, the same bytes.
      - name: playguard.zip
        run: |
          python scripts/package.py --out dist/playguard.zip --version-must-be "$TAG"
          cd dist && sha256sum playguard.zip > SHA256SUMS.txt
      # Anyone can then check that a download came from this repository's CI, unchanged:
      #   gh attestation verify playguard.zip -R JigSawFr/playguard-ha
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/playguard.zip
      # --clobber: a re-run replaces its own files.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" --clobber dist/playguard.zip dist/SHA256SUMS.txt
      # The version is out: its pre-releases go (a stable one supersedes them).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_APP_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Remove the version's pre-releases
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | python scripts/prerelease.py stale "${TAG#v}" --keep 0 \
            | while read -r old; do if [ -n "$old" ]; then gh release delete "$old" --cleanup-tag --yes; fi; done

  # The release PR as it stands, as a pre-release: vX.Y.Z-dev.N, the next
  # version and its changelog so far, at the PR's head. Not again for a head
  # already published (release-please runs on every push to main).
  prerelease:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true' && needs.release-please.outputs.pr != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write        # the pre-release and its tag
      id-token: write        # sign the attestation
      attestations: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_APP_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          fetch-depth: 0     # the tags, to tell a head already published
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git tag --points-at HEAD | grep -q -- '-dev\.'; then
            echo "This head is already a pre-release: $(git tag --points-at HEAD | tr '\n' ' ')"
            exit 0
          fi
          gh release list --limit 200 --json tagName --jq '.[].tagName' > tags.txt
          version=$(python scripts/prerelease.py version < tags.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: playguard.zip
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/prerelease.py stamp "$VERSION"
          python scripts/prerelease.py notes "$VERSION" --out notes.md
          python scripts/package.py --out dist/playguard.zip --version-must-be "$VERSION"
          cd dist && sha256sum playguard.zip > SHA256SUMS.txt
      - name: Build provenance
        if: steps.version.outputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/playguard.zip
      - name: Publish the pre-release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh release create "v$VERSION" --prerelease --target "$SHA" --title "$VERSION" \
            --notes-file notes.md dist/playguard.zip dist/SHA256SUMS.txt
          python scripts/prerelease.py stale "${VERSION%%-*}" --keep 4 < tags.txt \
            | while read -r old; do if [ -n "$old" ]; then gh release delete "$old" --cleanup-tag --yes; fi; done
