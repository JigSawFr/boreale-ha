blueprint:
  name: PlayGuard — a few minutes left, extra time from the notification
  description: >-
    When a game has 10 minutes left before the day's limit (the console's
    *Play time almost over* event), a notification on a phone with the game and the
    minutes left, and a button that gives extra time. Needs the Home Assistant
    app on the phone, a PlayGuard that sends the event, and *Orders may change
    the play timer* on the console for the button.
  domain: automation
  author: JigSawFr
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/JigSawFr/boreale-ha/blob/main/blueprints/automation/boreale/time_warning.yaml
  input:
    events:
      name: Events
      description: The console's *Events* entity.
      selector:
        entity:
          filter:
            - integration: boreale
              domain: event
    phone:
      name: Phone
      description: The phone told (the Home Assistant app).
      selector:
        device:
          filter:
            - integration: mobile_app
    minutes:
      name: Extra time
      description: What the notification's button gives.
      default: 15
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: min
    wait:
      name: Button valid for
      description: How long the notification's button gives extra time.
      default:
        hours: 0
        minutes: 30
        seconds: 0
      selector:
        duration:

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input events
    not_to:
      - unavailable
      - unknown

variables:
  events: !input events
  minutes: !input minutes
  console: "{{ device_id(events) }}"
  left: "{{ trigger.to_state.attributes.minutes_left }}"
  game: "{{ trigger.to_state.attributes.game }}"

conditions:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.event_type == 'time_warning' }}"

actions:
  # The button's id: this run's own, so an older notification's does nothing.
  - variables:
      more: "{{ 'PLAYGUARD_MORE_' ~ context.id }}"
  - domain: mobile_app
    type: notify
    device_id: !input phone
    title: "{{ device_attr(console, 'name_by_user') or device_attr(console, 'name') }}"
    message: >-
      {{ (left ~ ' min left') if left is number else 'A few minutes left' }}{{ (' on ' ~ game) if game else '' }}.
    data:
      tag: "{{ 'playguard_time_warning_' ~ console }}"
      actions:
        - action: "{{ more }}"
          title: "+{{ minutes }} min"
  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ more }}"
    timeout: !input wait
    continue_on_timeout: false
  - action: boreale.add_bonus_time
    data:
      device_id: "{{ console }}"
      minutes: "{{ minutes }}"
